limit_req_zone $binary_remote_addr zone=review_feedback:10m rate=5r/m;
# Versioned browser derivatives (adaptive ladder, progressive and card previews)
# never change under the same name, so browsers may keep them. A changed encode
# is published under a new version suffix. Everything else keeps nginx defaults.
map $uri $composite_cache_control {
  default "";
  "~^/composite-review/media/composite/[a-z0-9-]+/(?:stream-v[0-9]+/.+|(?:browser|card)-preview-v[0-9]+\.mp4)$" "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name theplatelab.studio www.theplatelab.studio theplatelab.site www.theplatelab.site www.platelabstudio.com;
  return 308 https://platelabstudio.com$request_uri;
}
server {
  listen 80;
  server_name platelabstudio.com;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  set_real_ip_from 172.18.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  client_max_body_size 32k;
  # Telemetry, maps and playlists are text; footage and images are already compressed.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json image/svg+xml application/vnd.apple.mpegurl;
  location = /composite-review/api/feedback {
    limit_req zone=review_feedback burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://platelab-composite-feedback:8080;
    proxy_read_timeout 25s;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
  }
  location ^~ /composite-review/api/ { return 404; }
  location = /composite-review { try_files /composite-review/index.html =404; }
  location = /composite-review/catalog.json { alias /ingested/catalog.json; add_header Cache-Control "no-store"; }
  location ^~ /composite-review/media/composite/ {
    alias /ingested/media/composite/;
    # add_header here replaces the server-level set, so those are repeated.
    # An empty value (unversioned files) sends no Cache-Control header.
    add_header Cache-Control $composite_cache_control;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  location ^~ /composite-review/media/ { try_files $uri =404; }
  location ^~ /composite-review/stage/ { try_files $uri $uri/ =404; }
  location ^~ /composite-review/assets/ { try_files $uri =404; }
  location /composite-review/ { if ($request_method !~ ^(GET|HEAD)$) { return 405; } try_files $uri $uri/ /composite-review/index.html; }
  location / { return 404; }
}
